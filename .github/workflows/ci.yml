name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  minimal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --frozen --all-extras --no-editable
      - run: .venv/bin/pytest -q tests/test_workflow.py
      - run: uv build
